# Local development stack: a single-node OpenSearch without the security
# plugin and the MCP server in HTTP mode on http://localhost:8080/mcp.
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mcp:
    build: .
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      MCP_TRANSPORT: http
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      opensearch:
        condition: service_healthy
